[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccaf-project"
version = "0.1.0"
description = "MCP tools for dataset ingestion, cleaning, and analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0.0,<2.0.0",
  "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
ccaf-mcp = "mcp_server.server:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mcp_server*"]
